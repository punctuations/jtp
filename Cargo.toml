[package]
name = "jtp"
version = "1.0.0"
edition = "2021"
authors = ["Matt <hey@mattt.space>"]
description = "Jason Transfer Protocol: high-performance, batch image transfer protocol"
license = "MIT"
repository = "https://github.com/punctuations/jtp"

[dependencies]
quinn = "0.11"
tokio = { version = "1.30", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
rcgen = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
unicode-normalization = "0.1"
serde_json = "1.0"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
colored = "2"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"